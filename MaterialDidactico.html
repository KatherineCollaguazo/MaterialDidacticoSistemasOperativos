<script>'use strict';
const BASE='https://ull-esit-sistemas-operativos.github.io/ssoo-apuntes/';
const CHAPTERS=[{name:'Introducción',icon:'book',range:[1,3]},{name:'Organización',icon:'layers',range:[4,8]},{name:'Procesos',icon:'gear',range:[9,14]},{name:'Memoria',icon:'ram',range:[15,17]},{name:'Almacenamiento',icon:'disk',range:[18,20]}];
const TOPICS=[
{id:1,title:'Definiciones',group:0,scene:'¿Quién guarda realmente tu foto?',summary:'Distingue la aplicación, el sistema operativo y el hardware.',path:'introduccion/definiciones/',lead:'El sistema operativo organiza el uso de los recursos y controla la ejecución de los programas. Una aplicación resuelve una tarea del usuario; el SO le proporciona un entorno y acceso controlado al hardware.',points:['El núcleo o kernel es la parte central del sistema operativo; no es lo mismo que todas sus aplicaciones y servicios.','Desde la perspectiva del sistema, el SO administra recursos y protege su uso.','Desde la perspectiva del usuario, facilita ejecutar programas y organizar archivos.'],terms:[['Recurso','Tiempo de CPU, memoria, almacenamiento o un dispositivo.'],['Aplicación','Programa que realiza una tarea para el usuario.'],['Kernel','Parte interna que gestiona funciones esenciales y acceso privilegiado.']],takeaway:'Guardar una foto requiere cooperación: la aplicación produce datos, el SO organiza su acceso al almacenamiento y el dispositivo conserva los bytes.',question:'¿El sistema operativo decide qué filtro artístico aplicar a la foto?',answer:'La aplicación decide el filtro. El sistema operativo proporciona recursos y servicios para que pueda ejecutarlo.',instructions:'Retoca la foto y después pulsa Guardar. Avanza por cada participante.',note:'Recorrido ilustrativo; no accede a fotos ni al disco real.'},
{id:2,title:'Tipos de sistemas',group:0,scene:'Un sistema para cada misión',summary:'Compara objetivos: lotes, interacción y plazos de tiempo real.',path:'introduccion/tipos-de-sistemas-operativos/',lead:'El diseño de un SO depende de su propósito: aprovechar recursos, responder a usuarios, coordinar máquinas o cumplir plazos. Estas categorías pueden combinarse.',points:['Los lotes agrupan trabajos con poca interacción durante su ejecución.','El tiempo compartido reparte oportunidades de ejecución entre usuarios o tareas.','En tiempo real importa cumplir un plazo, además de obtener un resultado correcto.','También existen sistemas de escritorio, servidores, empotrados, distribuidos y multiprocesador.'],terms:[['Lote','Conjunto de trabajos preparados para ejecución automática.'],['Tiempo compartido','Acceso alternado a recursos para sostener la interacción.'],['Tiempo real','Ejecución con restricciones temporales explícitas.']],takeaway:'Un diseño adecuado depende de la misión; una respuesta rápida en promedio no garantiza todos los plazos.',question:'¿Un sistema de tiempo real es simplemente el más rápido?',answer:'No. Su característica es atender restricciones de tiempo; un resultado tardío puede dejar de ser útil.',instructions:'Elige una misión, selecciona un diseño y prueba si satisface su objetivo.',note:'Comparación cualitativa; no es una prueba de rendimiento de sistemas reales.'},
{id:3,title:'Historia',group:0,scene:'La misma tarea en distintas épocas',summary:'Explora cómo cambió la forma de entregar y ejecutar trabajos.',path:'introduccion/historia-de-los-sistemas-operativos/',lead:'Los sistemas operativos evolucionaron para resolver problemas concretos: automatizar trabajos, aprovechar la CPU durante la E/S, compartir equipos y facilitar la interacción.',points:['Las primeras computadoras no tenían un sistema operativo como los actuales.','El procesamiento por lotes automatizó la ejecución de trabajos preparados.','La multiprogramación permitió aprovechar la CPU mientras otro trabajo esperaba.','UNIX, las computadoras personales, las redes y GNU/Linux ampliaron formas de uso y organización.'],terms:[['Monitor de sistema','Programa temprano que automatizaba la ejecución de lotes.'],['Multiprogramación','Varios programas en memoria para alternar su ejecución.'],['Terminal','Dispositivo de interacción conectado a un equipo central.']],takeaway:'Cada etapa incorporó mecanismos para responder a nuevas necesidades de hardware y de usuarios.',question:'¿Por qué fue útil tener otro programa listo mientras uno esperaba al disco?',answer:'Porque la CPU podía ejecutar ese otro programa en lugar de permanecer ociosa durante la espera.',instructions:'Selecciona una etapa y ejecuta el mismo trabajo: calcular y obtener su salida.',note:'Cinco escenas didácticas, no una reproducción histórica exacta ni una emulación.'},
{id:4,title:'Componentes',group:1,scene:'Radiografía de una videollamada',summary:'Descubre qué gestores participan en una acción cotidiana.',path:'organizacion/componentes-del-sistema/',lead:'Los componentes del SO se especializan en procesos, memoria, E/S, archivos, almacenamiento, red y protección. Una misma acción puede necesitar varios de ellos.',points:['El gestor de procesos controla ejecución y recursos de los procesos.','El gestor de memoria asigna y protege regiones de memoria.','La E/S conecta las operaciones con los dispositivos mediante controladores.','Archivos, almacenamiento, red y protección colaboran según la solicitud.'],terms:[['Controlador','Software que permite operar un dispositivo.'],['Buffer','Zona temporal que absorbe diferencias en el ritmo de intercambio.'],['Spooling','Almacenamiento temporal de trabajos destinados a un dispositivo.']],takeaway:'Los componentes son piezas internas especializadas; los servicios aparecen gracias a su cooperación.',question:'¿Para grabar una llamada basta únicamente con gestionar la red?',answer:'No. También intervienen procesos, memoria, E/S, archivos, almacenamiento y controles de acceso.',instructions:'Prueba una videollamada o su grabación. Desactiva un componente del modelo y observa la dependencia.',note:'Los interruptores modifican este modelo; no desactivan componentes del equipo.'},
{id:5,title:'Servicios',group:1,scene:'La grabadora que pide ayuda',summary:'Experimenta con E/S, archivos, comunicación y protección.',path:'organizacion/servicios-del-sistema/',lead:'Los servicios del SO permiten ejecutar programas, realizar E/S, operar con archivos y comunicar procesos. Otros servicios asignan recursos, monitorizan el uso y protegen el sistema.',points:['Un servicio expresa qué puede solicitar un programa o usuario.','Una operación visible puede requerir varios servicios internos.','La detección de errores permite comunicar situaciones como falta de espacio.','La protección controla el acceso a recursos y datos.'],terms:[['E/S','Intercambio de datos con dispositivos.'],['Monitorización','Seguimiento del uso de recursos y del comportamiento del sistema.'],['Protección','Reglas para permitir o impedir accesos a los recursos.']],takeaway:'Una grabación necesita servicios diferentes para capturar, guardar y comunicar sus datos.',question:'Si se puede grabar, ¿eso garantiza que también se pueda guardar?',answer:'No. La escritura puede fallar por falta de espacio o de permiso, aunque la captura funcione.',instructions:'Graba, guarda y comparte. Cambia permisos, espacio o red para observar errores distintos.',note:'Grabación y envío simulados; no usa micrófono ni transmite datos.'},
{id:6,title:'Interfaz de programación',group:1,scene:'Un clic, varias capas',summary:'Separa funciones de biblioteca y llamadas al sistema.',path:'organizacion/interfaz-de-programacion-de-aplicaciones/',lead:'Una aplicación suele utilizar bibliotecas o una API. Estas pueden resolver trabajo en espacio de usuario y recurrir a llamadas al sistema cuando necesitan servicios del kernel.',points:['Una API define cómo utilizar una funcionalidad desde un programa.','POSIX y Windows API ofrecen interfaces con convenciones diferentes.','Una llamada al sistema entra al kernel por un mecanismo controlado.','La E/S con buffer muestra por qué no hay una relación obligatoria de uno a uno entre función y syscall.'],terms:[['API','Interfaz de programación de aplicaciones.'],['Biblioteca','Funciones reutilizables usadas por una aplicación.'],['Syscall','Solicitud de un servicio al núcleo.']],takeaway:'Añadir texto al buffer de una biblioteca puede no producir todavía una escritura al dispositivo.',question:'¿Cada fragmento enviado a una biblioteca debe generar inmediatamente una syscall de escritura?',answer:'No. Una biblioteca puede acumular fragmentos en un buffer y enviarlos juntos más tarde.',instructions:'Abre el archivo del modelo, añade texto al buffer y vacíalo antes de cerrar.',note:'Modelo de E/S con buffer inspirado en stdio; las llamadas y su número reales dependen de la implementación.'},
{id:7,title:'Operación del sistema',group:1,scene:'La cabina de acceso restringido',summary:'Observa modo dual, excepciones, syscalls y temporizador.',path:'organizacion/operacion-del-sistema-operativo/',lead:'El hardware distingue privilegios de ejecución. Interrupciones, excepciones y llamadas al sistema transfieren el control a manejadores del núcleo de forma controlada.',points:['En modo usuario se restringen las operaciones privilegiadas.','Una syscall es una solicitud intencional; una instrucción prohibida provoca una excepción.','Las interrupciones de dispositivos llegan de forma asíncrona respecto al programa.','El temporizador permite recuperar el control en un sistema apropiativo.'],terms:[['Modo kernel','Ejecución con privilegios del núcleo.'],['Excepción','Evento asociado a la ejecución de una instrucción.'],['Interrupción','Evento que reclama atención, por ejemplo desde un dispositivo.']],takeaway:'El cambio de privilegios lo realiza el hardware como parte de una entrada controlada al núcleo.',question:'¿Puede una aplicación evitar que la retiren de la CPU desactivando libremente el temporizador?',answer:'No. Configurar el temporizador y desactivar interrupciones son operaciones protegidas.',instructions:'Prueba una syscall, una instrucción prohibida o un bucle de usuario que consume su turno.',note:'La CPU y sus modos son simulados; no se ejecutan instrucciones privilegiadas.'},
{id:8,title:'Sistemas por su estructura',group:1,scene:'Un sistema operativo desmontable',summary:'Compara dónde viven los servicios y cómo colaboran.',path:'organizacion/sistemas-operativos-por-su-estructura/',lead:'La estructura organiza las responsabilidades y las fronteras del sistema. Los diseños monolíticos, por capas, microkernel y modulares distribuyen de modo diferente las funciones.',points:['Un núcleo monolítico incluye muchos servicios dentro del espacio del kernel.','En capas, cada nivel utiliza servicios de niveles inferiores.','Un microkernel conserva un núcleo pequeño y desplaza servicios a procesos de usuario.','Los módulos permiten incorporar componentes manteniendo una organización extensible.'],terms:[['Monolítico','Muchos subsistemas se ejecutan dentro del núcleo.'],['Microkernel','Núcleo con funciones mínimas y servicios separados.'],['Módulo','Componente que se integra mediante una interfaz definida.']],takeaway:'Cambiar la estructura modifica fronteras de protección, rutas de comunicación y consecuencias potenciales de un fallo.',question:'¿En un microkernel todos los servicios tienen que vivir dentro del núcleo?',answer:'No. Es habitual que varios servicios se implementen como procesos fuera del núcleo.',instructions:'Cambia la arquitectura y recorre una lectura de archivo. Después simula un fallo del servicio.',note:'Diseños simplificados; la ubicación de controladores y servicios varía entre sistemas concretos.'},
{id:9,title:'Procesos',group:2,scene:'La vida de una exportación de audio',summary:'Controla estados, PCB y la relación padre-hijo.',path:'procesos/procesos/',lead:'Un proceso es un programa en ejecución con estado y recursos. El SO conserva información de control para detenerlo y reanudarlo.',points:['Listo significa esperar CPU; bloqueado significa esperar un evento.','El PCB guarda información como PID, registros, estado y recursos.','fork() crea un hijo; exec() reemplaza su programa y conserva el PID.','wait() recoge el estado del hijo. Si el hijo termina antes de recogerse, puede quedar zombie.'],terms:[['PCB','Bloque de Control de Proceso.'],['Cambio de contexto','Guardar el estado de una ejecución y restaurar el de otra.'],['Zombie','Hijo terminado cuyo estado aún no ha sido recogido.']],takeaway:'Cuando termina la E/S, el proceso vuelve a listo; después el planificador puede darle CPU.',question:'¿Un zombie sigue ejecutando el programa?',answer:'No. Ya terminó; queda un registro mínimo para que su padre recoja el resultado.',instructions:'Crea un hijo, dale CPU, solicita E/S y complétala. Prueba exec(), finalizar y wait().',note:'Se permite un hijo a la vez. La copia inicial se representa lógicamente; sistemas reales pueden usar copy-on-write.'},
{id:10,title:'Planificación de la CPU',group:2,scene:'Una exportación larga y un clic urgente',summary:'Compara FCFS, SJF y Round Robin con tiempos calculados.',path:'procesos/planificacion-de-la-cpu/',lead:'El planificador selecciona una ejecución de la cola de listos. Sus decisiones afectan espera, respuesta, retorno y aprovechamiento de la CPU.',points:['FCFS atiende por llegada y puede producir efecto convoy.','SJF selecciona la siguiente ráfaga más corta; aquí se conoce su duración.','Round Robin retira la CPU cuando se agota el quantum.','Retorno = finalización − llegada; espera excluye el tiempo ejecutado.'],terms:[['Quantum','Máximo turno de CPU antes de una apropiación en RR.'],['Respuesta','Tiempo desde la llegada hasta la primera ejecución.'],['Retorno','Tiempo desde la llegada hasta la finalización.']],takeaway:'Un quantum muy grande acerca RR a FCFS; uno pequeño aumenta la frecuencia de cambios.',question:'¿Un proceso tiene que consumir todo su quantum si ya terminó?',answer:'No. Al terminar o bloquearse libera la CPU antes de agotar el turno.',instructions:'Avanza el reloj o termina la ejecución. Cambia algoritmo y quantum para comparar resultados.',note:'Una CPU, ráfagas conocidas, sin E/S ni costo de cambio de contexto. Las llegadas de un límite se encolan antes de reinsertar el proceso cuyo quantum vence.'},
{id:11,title:'Paso de mensajes',group:2,scene:'El invernadero que envía avisos',summary:'Explora colas, capacidad y operaciones bloqueantes.',path:'procesos/comunicacion-mediante-paso-de-mensajes/',lead:'Los procesos pueden comunicarse enviando y recibiendo mensajes sin compartir directamente sus variables. El mecanismo define destinatarios, formato, capacidad y comportamiento de espera.',points:['Una cola permite desacoplar el momento del envío y de la recepción.','Recibir de una cola vacía puede bloquear o devolver un error, según el modo.','Enviar a una cola llena puede esperar espacio o fallar sin bloquear.','Tuberías, colas de mensajes y sockets son mecanismos de comunicación con características diferentes.'],terms:[['IPC','Comunicación entre procesos.'],['Bloqueante','La ejecución espera hasta que la operación pueda continuar.'],['No bloqueante','La operación devuelve el resultado disponible sin quedarse esperando.']],takeaway:'Una cola con capacidad limitada obliga a decidir cómo manejar un productor más rápido que el receptor.',question:'¿Qué pasa si el receptor se detiene y la cola se llena?',answer:'En modo bloqueante, un envío puede esperar; en modo no bloqueante puede devolver un error.',instructions:'Envía mediciones, pausa al receptor y llena la cola. Después recibe para liberar espacio.',note:'Cola FIFO acotada del modelo; no representa todos los tipos de IPC ni prioridades de mensajes.'},
{id:12,title:'Memoria compartida',group:2,scene:'Subtítulos sobre una pizarra común',summary:'Distingue regiones privadas y una región compartida.',path:'procesos/memoria-compartida/',lead:'Aunque los procesos tienen espacios de direcciones separados, el SO puede permitir que mapeen una misma región de memoria. Así intercambian datos accediendo a esa región.',points:['Compartir requiere crear u obtener la región y mapearla en los procesos.','La memoria privada de un proceso no se vuelve compartida automáticamente.','Escribir en la región compartida cambia los datos que puede leer el otro proceso.','Compartir datos no resuelve la coordinación de accesos concurrentes; hace falta sincronización.'],terms:[['Mapear','Incorporar una región al espacio de direcciones de un proceso.'],['Memoria privada','Datos que no están compartidos con el otro proceso en este modelo.'],['Región compartida','Datos accesibles por ambos procesos autorizados.']],takeaway:'Los procesos comparten una región concreta, sin perder necesariamente el aislamiento del resto de su memoria.',question:'Si A modifica una variable privada, ¿B ve ese cambio?',answer:'No. Para verlo en este ejemplo, ambos deben acceder a la región compartida.',instructions:'Crea la región, mapea A y B, escribe desde A y consulta desde B.',note:'Modelo secuencial para explicar visibilidad. Los accesos simultáneos requieren protección adicional.'},
{id:13,title:'Hilos',group:2,scene:'El editor que sigue respondiendo',summary:'Compara ejecución secuencial, multihilo y núcleos.',path:'procesos/hilos/',lead:'Un hilo es una unidad de ejecución dentro de un proceso. Los hilos comparten el espacio de direcciones y recursos, pero tienen estado de ejecución propio.',points:['Comparten código, datos, heap y archivos abiertos.','Cada hilo tiene su pila, registros y contador de programa.','Concurrencia es progreso intercalado; paralelismo requiere recursos de ejecución simultánea.','En M:1, muchos hilos de usuario dependen de un hilo de kernel; una syscall bloqueante puede detenerlos a todos.'],terms:[['M:1','Muchos hilos de usuario sobre un hilo del núcleo.'],['1:1','Cada hilo de usuario se corresponde con un hilo del núcleo.'],['Núcleo de CPU','Recurso físico capaz de ejecutar trabajo.']],takeaway:'Varios hilos pueden mejorar la respuesta sin que eso implique ejecutar todo en paralelo.',question:'¿Cuatro hilos garantizan usar cuatro núcleos en M:1?',answer:'No. En M:1 solo hay un hilo de kernel y no se obtiene ese paralelismo.',instructions:'Inicia una exportación y solicita volumen. Cambia el modelo y simula una espera de E/S.',note:'Trabajo divisible en ocho bloques, como máximo dos trabajadores de exportación. Es una comparación didáctica, no una medición real.'},
{id:14,title:'Sincronización',group:2,scene:'Dos cajeros, una sola cuenta',summary:'Provoca una condición de carrera y protégela con un mutex.',path:'procesos/sincronizacion/',lead:'Cuando varios hilos o procesos comparten datos, el resultado puede depender del orden de sus operaciones. La sincronización coordina ese acceso.',points:['Leer, comprobar y actualizar una variable no constituyen necesariamente una operación atómica.','Una condición de carrera puede causar resultados inconsistentes.','La sección crítica debe proteger todas las operaciones relacionadas.','Un mutex proporciona exclusión mutua; semáforos y variables de condición permiten otros tipos de coordinación.'],terms:[['Sección crítica','Código que accede a un recurso compartido y necesita coordinación.'],['Mutex','Objeto que permite un único propietario a la vez.'],['Atomicidad','Una operación se observa como una unidad indivisible.']],takeaway:'Proteger solo la escritura deja sin coordinar la lectura y la comprobación del saldo.',question:'Si ambos cajeros leen $100 antes de actualizarlo, ¿pueden aprobar cada uno $80?',answer:'En el modelo incorrecto sí: pueden entregar $160 y acabar registrando $20. El saldo almacenado ya no coincide con el dinero entregado.',instructions:'Ejecuta paso a paso sin protección. Luego activa el mutex y repite desde el inicio.',note:'Dos hilos y un saldo compartido del modelo; no describe la implementación de bancos reales.'},
{id:15,title:'Memoria principal',group:3,scene:'¡Hay memoria libre, pero no cabe!',summary:'Comprende asignación contigua, fragmentación externa y compactación.',path:'memoria/memoria-principal/',lead:'En la asignación contigua, cada proceso necesita una región física consecutiva. Tener suficiente memoria libre total no garantiza que exista un hueco lo bastante grande.',points:['Primer ajuste elige el primer hueco suficiente; mejor ajuste, el menor hueco suficiente.','La fragmentación externa reparte la memoria libre en huecos separados.','La compactación reúne huecos moviendo regiones ocupadas.','Mover procesos exige soporte para reubicación durante la ejecución y consume tiempo.'],terms:[['Hueco','Región contigua libre.'],['Fragmentación externa','Espacio libre suficiente en total, pero dividido.'],['Reubicación','Adaptación de direcciones cuando cambia la ubicación de un proceso.']],takeaway:'Tres huecos de 20 MiB suman 60 MiB, pero no alojan una petición contigua de 40 MiB.',question:'¿60 MiB libres garantizan alojar un proceso de 40 MiB?',answer:'No en asignación contigua. También debe existir un hueco de al menos 40 MiB.',instructions:'Libera B, D y F. Solicita 40 MiB. Compara memoria libre total y mayor hueco; después compacta y vuelve a solicitar.',note:'Modelo de asignación contigua: 120 MiB en 12 celdas. No representa el asignador de RAM completo de Windows o Linux; compactar aquí supone procesos reubicables.'},
{id:16,title:'Paginación',group:3,scene:'Un programa repartido encuentra sus piezas',summary:'Traduce direcciones con páginas, marcos y TLB.',path:'memoria/paginacion/',lead:'La paginación divide el espacio virtual en páginas y la memoria física en marcos del mismo tamaño. Una tabla de páginas relaciona ambas partes.',points:['La MMU separa número de página y desplazamiento.','La traducción reemplaza la página por el marco y conserva el desplazamiento.','La TLB guarda algunas traducciones para acelerar consultas.','Dos procesos pueden usar la misma dirección virtual y tener traducciones diferentes.'],terms:[['Página','Bloque del espacio de direcciones virtual.'],['Marco','Bloque de la memoria física.'],['TLB','Caché de traducciones de direcciones.']],takeaway:'Un proceso puede ver direcciones consecutivas aunque sus páginas ocupen marcos separados.',question:'¿Un fallo de TLB significa siempre que la página no está en RAM?',answer:'No. Puede bastar con consultar la tabla de páginas; un fallo de página es un evento distinto.',instructions:'Traduce una dirección varias veces y cambia de proceso. Prueba escribir en la página protegida.',note:'Páginas de 16 bytes para facilitar las cuentas. Todas están residentes. La TLB del modelo incluye identificador de proceso.'},
{id:17,title:'Memoria virtual',group:3,scene:'Un álbum enorme en una mesa pequeña',summary:'Observa demanda de páginas y reemplazo FIFO o LRU.',path:'memoria/memoria-virtual/',lead:'La memoria virtual permite ejecutar procesos sin mantener todas sus páginas simultáneamente en RAM. Las páginas necesarias pueden cargarse bajo demanda.',points:['Acceder a una página válida no residente provoca un fallo de página.','Si no hay un marco libre, se elige una página para reemplazar.','FIFO considera el orden de carga; LRU, el uso más reciente.','Demasiados fallos pueden producir hiperpaginación y reducir el progreso útil.'],terms:[['Fallo de página','Evento que requiere atender una página no disponible o un acceso no válido.'],['FIFO','Reemplaza la página cargada hace más tiempo.'],['LRU','Reemplaza la página usada hace más tiempo.']],takeaway:'La memoria virtual no convierte el almacenamiento en RAM igualmente rápida ni elimina los límites del sistema.',question:'¿FIFO y LRU deben expulsar siempre la misma página?',answer:'No. Una página antigua puede haberse usado recientemente; FIFO y LRU consideran información diferente.',instructions:'Avanza la secuencia, cambia la política o prueba el recorrido que supera el conjunto de marcos.',note:'Solo lecturas de páginas válidas con respaldo. No se modelan páginas sucias, latencias reales ni asignación entre procesos.'},
{id:18,title:'Almacenamiento secundario',group:4,scene:'¿Sobreviven las fotos si falla un disco?',summary:'Compara un disco, distribución RAID 0 y espejo RAID 1.',path:'almacenamiento/almacenamiento-secundario/',lead:'El almacenamiento secundario conserva información en bloques. El sistema puede organizar dispositivos y particiones en volúmenes, incluidos conjuntos RAID.',points:['Los discos magnéticos tienen componentes mecánicos; las memorias de estado sólido no.','RAID 0 distribuye bloques y aprovecha capacidad, pero no proporciona redundancia.','RAID 1 mantiene un espejo; con dos discos iguales, la capacidad útil equivale a uno.','La redundancia frente a fallos de disco no conserva por sí sola versiones anteriores de archivos.'],terms:[['Volumen','Unidad lógica donde puede alojarse un sistema de archivos.'],['RAID 0','Distribución de bloques entre discos sin redundancia.'],['RAID 1','Datos reflejados en discos distintos.']],takeaway:'Un espejo puede mantener los datos accesibles tras fallar un disco, pero replica también los borrados.',question:'¿Duplicar los discos de un espejo duplica también su capacidad útil?',answer:'No en el espejo de dos discos iguales: se usa una copia de los datos en cada uno.',instructions:'Guarda fotos, falla un disco y observa disponibilidad. Reinicia y repite con otro diseño.',note:'Dos discos de 40 unidades y fotos de 10. Conjunto simplificado, sin paridad, cachés ni tiempos reales.'},
{id:19,title:'Sistemas de archivos',group:4,scene:'Dos nombres, un mismo archivo',summary:'Separa nombres, contenido y metadatos mediante enlaces duros.',path:'almacenamiento/sistema-de-archivos/',lead:'Un sistema de archivos ofrece nombres, directorios, atributos y operaciones. Una entrada de directorio relaciona un nombre con la información del archivo.',points:['Los metadatos incluyen tamaño, permisos y referencias a los datos.','Un enlace duro añade otro nombre para el mismo archivo dentro del volumen.','Editar desde cualquiera de esos nombres modifica el mismo contenido.','Al eliminar el último enlace, el archivo puede liberarse cuando ningún proceso lo mantiene abierto.'],terms:[['FCB / inodo','Estructura que describe un archivo y permite localizar sus datos.'],['Enlace duro','Entrada de directorio que referencia el mismo archivo.'],['Contador de enlaces','Cantidad de nombres que apuntan al archivo.']],takeaway:'Eliminar un nombre no equivale siempre a eliminar inmediatamente los datos del archivo.',question:'¿Un enlace duro es una copia independiente de los datos?',answer:'No. Los nombres comparten el mismo identificador de archivo y el mismo contenido.',instructions:'Crea otro nombre, edita el texto y elimina un enlace. Prueba mantener el archivo abierto al borrar el último.',note:'Un archivo regular en un único volumen; no representa enlaces simbólicos ni directorios enlazados.'},
{id:20,title:'Implementación de sistemas de archivos',group:4,scene:'¿Dónde quedaron los pedazos del video?',summary:'Compara asignación contigua, enlazada e indexada.',path:'almacenamiento/implementacion-de-sistemas-de-archivos/',lead:'La implementación traduce operaciones sobre archivos a estructuras y bloques. Distintos métodos asignan y localizan los bloques de datos de maneras diferentes.',points:['La asignación contigua guarda bloques consecutivos y facilita calcular su ubicación.','La enlazada conecta bloques mediante referencias al siguiente.','La indexada usa un bloque de índices para localizar los bloques de datos.','La gestión del espacio libre registra qué bloques se pueden reutilizar.'],terms:[['Bloque lógico','Posición de un bloque dentro del archivo.'],['Bloque físico','Ubicación del bloque en el dispositivo del modelo.'],['Mapa de bits','Registro de bloques libres y ocupados.']],takeaway:'El mismo archivo puede ocupar bloques físicos separados sin que el usuario tenga que conocer sus ubicaciones.',question:'¿Por qué un índice puede ayudar a acceder a un bloque intermedio?',answer:'Porque permite obtener su dirección sin recorrer todos los enlaces anteriores.',instructions:'Intenta reservar cuatro bloques. Cambia el método, consulta un bloque lógico y observa el recorrido.',note:'16 bloques, sin caché ni metadatos adicionales. El método indexado reserva un bloque de índices. Los accesos mostrados son del modelo.'}
];
const ICON_PATHS={book:'M4 4h7l2 2 2-2h7v16h-7l-2 2-2-2H4z M13 6v16',layers:'M12 3 2 8l10 5 10-5-10-5z M2 12l10 5 10-5 M2 17l10 5 10-5',gear:'M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1 1-3z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',ram:'M4 5h16v14H4z M8 9h8v6H8z M8 2v3 M12 2v3 M16 2v3 M8 19v3 M12 19v3 M16 19v3 M1 9h3 M1 15h3 M20 9h3 M20 15h3',disk:'M4 6c0-4 16-4 16 0s-16 4-16 0z M4 6v12c0 4 16 4 16 0V6 M4 12c0 4 16 4 16 0',atm:'M5 3h14v18H5z M8 6h8v6H8z M9 16h1 M13 16h1 M9 18h1 M13 18h1'};
function icon(name){return `<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON_PATHS[name]||ICON_PATHS.gear}"/></svg>`;}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,cls='',disabled=false)=>`<button data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`;
const select=(label,key,items,value,config=false)=>`<label>${label}<select data-input="${key}" ${config?'data-config="true"':''}>${items.map(x=>`<option value="${esc(Array.isArray(x)?x[0]:x)}" ${String(Array.isArray(x)?x[0]:x)===String(value)?'selected':''}>${esc(Array.isArray(x)?x[1]:x)}</option>`).join('')}</select></label>`;
const number=(label,key,value,min,max,step=1,config=false)=>`<label>${label}<input data-input="${key}" type="number" value="${value}" min="${min}" max="${max}" step="${step}" ${config?'data-config="true"':''}></label>`;
const textInput=(label,key,value)=>`<label class="wide">${label}<input data-input="${key}" type="text" maxlength="100" value="${esc(value)}"></label>`;
const check=(label,key,value,config=false)=>`<label class="check"><input data-input="${key}" type="checkbox" ${value?'checked':''} ${config?'data-config="true"':''}>${label}</label>`;
const stat=(label,value)=>`<div class="readout"><h4>${label}</h4><div class="value">${value}</div></div>`;
const flow=(items,active=-1)=>`<div class="flow">${items.map((x,i)=>`<div class="node ${i===active?'lit':''}">${x}</div>`).join('')}</div>`;
const pill=(text,kind='')=>`<span class="tag ${kind}">${esc(text)}</span>`;
const logView=s=>s.logs.length?`<div class="log" role="log" aria-label="Registro de la simulación">${s.logs.slice(-9).map((l,i)=>`<div><span>${s.logs.length- Math.min(9,s.logs.length)+i+1}.</span>${esc(l)}</div>`).join('')}</div>`:'';
function baseState(form={}){return {form,message:'Elige una acción para comenzar. Puedes reiniciar el ejemplo en cualquier momento.',status:'',step:0,logs:[]};}
function tell(s,msg,status=''){s.message=msg;s.status=status;s.step++;s.logs.push(msg);if(s.logs.length>30)s.logs.shift();}
function result(s){return `<div class="statusbox ${s.status==='error'?'error':s.status==='warning'?'warning':''}">${esc(s.message)}</div>`;}
const SIMS={};
SIMS[1]={
 init:()=>({...baseState(),edited:false,saved:false,index:-1,route:[]}),
 view:s=>`<div class="photopreview ${s.edited?'edited':''}"><svg viewBox="0 0 450 145" aria-label="Ilustración de una foto de paisaje"><circle cx="340" cy="35" r="22" fill="#ffdf9e"/><path d="M0 145 120 38l135 107z" fill="#5b8798"/><path d="m180 145 120-87 150 87z" fill="#5b9f91"/><path d="m87 68 33-30 36 37-27-8-10 10-12-13z" fill="#eef6f6"/></svg></div>${flow(['Usuario','Aplicación','Sistema operativo','Hardware'],s.index<0?-1:s.route[s.index]?.actor)}<div class="controls">${btn('Retocar foto','edit')}${btn('Guardar foto','save','primary')}${btn('Siguiente participante','next','',s.index<0||s.index>=s.route.length-1)}</div><div class="stats two">${stat('Foto en memoria',s.edited?'Retocada':'Original')}${stat('Archivo del modelo',s.saved?'Guardado':'Pendiente')}</div>${logView(s)}`,

};

SIMS[2]={init:()=>({...baseState({mission:'lotes',design:'lotes'}),tested:false}),view:s=>`<div class="controls">${select('Misión','mission',MISSIONS.map(x=>[x[0],x[1]]),s.form.mission,true)}${select('Diseño a probar','design',[['lotes','Procesamiento por lotes'],['compartido','Tiempo compartido'],['real','Tiempo real']],s.form.design,true)}${btn('Probar diseño','run','primary')}</div><div class="readout"><h3>Objetivo de la misión</h3><p>${MISSIONS.find(x=>x[0]===s.form.mission)[2]}</p>${flow(s.form.mission==='lotes'?['Informe A','Informe B','Informe C']:s.form.mission==='compartido'?['Terminal A','Terminal B','Terminal C']:['Evento','Atención','Plazo'])}</div>${s.tested?result(s):''}${logView(s)}`,act(s,a){if(a==='config'){s.tested=false;return;}if(a!=='run')return;s.tested=true;let good=s.form.mission===s.form.design;const messages={lotes:'El monitor ejecuta la secuencia de informes sin esperar interacción entre trabajos.',compartido:'Los usuarios reciben oportunidades de ejecución alternadas, sosteniendo la interacción.',real:'El diseño considera prioridades y restricciones temporales para atender el plazo de la misión.'};tell(s,good?messages[s.form.design]:'Este diseño no prioriza el objetivo elegido. Revisa la misión: lotes buscan procesamiento, tiempo compartido busca interacción y tiempo real debe considerar los plazos.',good?'':'warning');}}

SIMS[3]={init:()=>({...baseState({era:'0'}),ran:false}),view:s=>`<div class="eraoptions">${ERAS.map((x,i)=>`<button data-action="era${i}" aria-pressed="${String(i===+s.form.era)}">${x[0]}</button>`).join('')}</div><div class="readout"><div class="eyebrow">${ERAS[+s.form.era][1]}</div><h3>Trabajo: calcular y obtener una salida</h3><div class="eraart">${ERAS[+s.form.era][3]}</div><p class="caption">Selecciona otra etapa para ver cómo cambia la organización del trabajo.</p></div><div class="controls">${btn('Ejecutar trabajo','run','primary')}</div>${s.ran?result(s):''}`,act(s,a){if(a.startsWith('era')){s.form.era=a.slice(3);s.ran=false;tell(s,'Etapa seleccionada: '+ERAS[+s.form.era][0]+'. Ejecuta el trabajo para ver el cambio.');}if(a==='run'){s.ran=true;tell(s,ERAS[+s.form.era][2]);}}};
const COMPONENTS=[['proc','Procesos','Ejecución y estado'],['mem','Memoria','Asignación y protección'],['io','Entrada / salida','Cámara y micrófono'],['net','Red','Intercambio de paquetes'],['files','Archivos','Nombres y operaciones'],['disk','Almacenamiento','Bloques en el dispositivo'],['security','Protección','Acceso autorizado']];
SIMS[4]={init:()=>({...baseState(Object.fromEntries(COMPONENTS.map(x=>[x[0],true]))),used:[]}),view:s=>`<div class="modulegrid">${COMPONENTS.map(x=>`<div class="module ${!s.form[x[0]]?'off':s.used.includes(x[0])?'lit':''}">${check(x[1],x[0],s.form[x[0]],true)}<p>${x[2]}</p></div>`).join('')}</div><div class="controls">${btn('Iniciar videollamada','call','primary')}${btn('Grabar llamada','record')}</div>${s.used.length?result(s):''}${logView(s)}`,act(s,a){if(a==='config'){s.used=[];return;}if(!['call','record'].includes(a))return;s.used=a==='call'?['proc','mem','io','net','security']:COMPONENTS.map(x=>x[0]);let missing=COMPONENTS.filter(x=>s.used.includes(x[0])&&!s.form[x[0]]);tell(s,missing.length?'La operación del modelo no puede completarse. Faltan: '+missing.map(x=>x[1]).join(', ')+'.':'La '+(a==='call'?'videollamada':'grabación')+' utiliza los componentes resaltados. La grabación añade organización de archivos y almacenamiento.',missing.length?'error':'');}};
SIMS[5]={init:()=>({...baseState({permission:true,space:true,network:true}),recorded:false,saved:false,sent:false,requests:0}),view:s=>`<div class="controls">${check('Permiso de escritura','permission',s.form.permission)}${check('Espacio libre','space',s.form.space)}${check('Red disponible','network',s.form.network)}</div>${flow(['Capturar audio','Guardar archivo','Comunicar datos'],s.sent?2:s.saved?1:s.recorded?0:-1)}<div class="controls">${btn('Grabar audio','record','primary')}${btn('Guardar','save')}${btn('Compartir','send')}</div><div class="stats">${stat('Captura',s.recorded?'Lista':'Pendiente')}${stat('Archivo',s.saved?'Guardado':'Pendiente')}${stat('Solicitudes',s.requests)}</div>${logView(s)}`,act(s,a){if(!['record','save','send'].includes(a))return;s.requests++;if(a==='record'){s.recorded=true;s.saved=false;s.sent=false;tell(s,'Servicio de E/S: se capturó un audio ficticio. Todavía no existe un archivo guardado.');}if(a==='save'){if(!s.recorded)return tell(s,'Primero captura un audio.','warning');if(!s.form.permission)return tell(s,'Protección: escritura denegada. La grabación existe en memoria, pero el archivo no se guardó.','error');if(!s.form.space)return tell(s,'Detección de errores: no queda espacio para guardar el archivo.','error');s.saved=true;tell(s,'Servicio de archivos: se creó audio.wav en el almacenamiento simulado.');}if(a==='send'){if(!s.saved)return tell(s,'Guarda el audio antes de compartirlo.','warning');if(!s.form.network)return tell(s,'Comunicación: no está disponible la conexión del modelo.','error');s.sent=true;tell(s,'Servicio de comunicación: se completó el envío ficticio. No se transmitieron datos reales.');}}};
SIMS[6]={init:()=>({...baseState({text:'Hola, UNIB.E.'}),open:false,buffer:'',disk:'',calls:0,layer:-1}),view:s=>`${flow(['Aplicación','Biblioteca','Syscall','Kernel','Dispositivo'],s.layer)}<div class="controls">${textInput('Fragmento de texto','text',s.form.text)}</div><div class="controls">${btn('Abrir','open','primary',s.open)}${btn('Añadir al buffer','write','',!s.open)}${btn('Vaciar buffer','flush','',!s.open)}${btn('Cerrar','close','',!s.open)}</div><div class="subgrid"><div><h3>Buffer de la biblioteca</h3><div class="buffer">${esc(s.buffer)||'Vacío'}</div></div><div><h3>Almacenamiento simulado</h3><div class="buffer">${esc(s.disk)||'Sin datos escritos'}</div></div></div><div class="stats two">${stat('Archivo',s.open?'Abierto':'Cerrado')}${stat('Syscalls del modelo',s.calls)}</div>${logView(s)}`,act(s,a){if(a==='open'&&!s.open){s.open=true;s.layer=3;s.calls++;s.disk='';tell(s,'La biblioteca solicita abrir el archivo: el modelo cuenta una syscall de apertura.');}if(a==='write'&&s.open){if(!s.form.text)return tell(s,'Escribe un fragmento antes de añadirlo.','warning');s.buffer+=s.form.text+' ';s.layer=1;tell(s,'El fragmento queda en el buffer de la biblioteca. No se ha añadido una syscall de escritura.');}if(a==='flush'&&s.open){if(!s.buffer)return tell(s,'El buffer está vacío: no hay bytes pendientes para escribir.');s.disk+=s.buffer;s.buffer='';s.calls++;s.layer=4;tell(s,'La biblioteca entrega el buffer mediante una escritura al kernel; el dispositivo del modelo recibe sus bytes.');}if(a==='close'&&s.open){let pending=!!s.buffer;if(pending){s.disk+=s.buffer;s.buffer='';s.calls++;}s.calls++;s.open=false;s.layer=2;tell(s,pending?'Cerrar vació primero el buffer y después cerró el archivo: dos syscalls en este modelo.':'Se cerró el archivo: una syscall de cierre en este modelo.');}}};
SIMS[7]={init:()=>({...baseState(),mode:'Usuario',event:'',ticks:0,alive:true}),view:s=>`<div class="stats two">${stat('Modo de CPU',pill(s.mode,s.mode==='Kernel'?'warn':'good'))}${stat('Programa de usuario',s.alive?'Activo':'Terminado')}</div>${flow(['Aplicación en usuario','Entrada controlada','Manejador del kernel'],s.mode==='Kernel'?2:0)}<div class="readout"><h4>Turno de la aplicación: 3 instrucciones del modelo</h4><div class="timer"><span style="width:${s.ticks/3*100}%"></span></div><p class="caption">${s.ticks} / 3 instrucciones antes de la interrupción del temporizador.</p></div><div class="controls">${btn('Solicitar lectura · syscall','syscall','primary',!s.alive||s.mode==='Kernel')}${btn('Intentar instrucción privilegiada','illegal','danger',!s.alive||s.mode==='Kernel')}${btn('Ejecutar bucle de usuario','tick','',!s.alive||s.mode==='Kernel')}${btn('Atender evento','handle','',s.mode!=='Kernel')}</div>${logView(s)}`,act(s,a){if(a==='handle'&&s.mode==='Kernel'){if(s.event==='illegal'){s.alive=false;tell(s,'El kernel atiende la violación y termina el programa. Un bucle de usuario no puede obtener privilegios por su cuenta.');}else tell(s,s.event==='timer'?'El kernel recuperó el control. Puede planificar otra ejecución; aquí reanuda la aplicación con un nuevo turno.':'El kernel completó la lectura y devuelve el control al modo usuario.');s.mode='Usuario';s.event='';s.ticks=0;return;}if(!s.alive||s.mode==='Kernel')return;if(a==='syscall'){s.mode='Kernel';s.event='syscall';tell(s,'La instrucción de entrada controlada hace que el hardware cambie los privilegios antes de ejecutar el manejador del kernel.');}if(a==='illegal'){s.mode='Kernel';s.event='illegal';tell(s,'El hardware detecta una instrucción prohibida y genera una excepción. El núcleo debe atenderla.','error');}if(a==='tick'){s.ticks++;if(s.ticks===3){s.mode='Kernel';s.event='timer';tell(s,'Interrupción del temporizador: el hardware transfiere el control al núcleo aunque la aplicación siga en su bucle.') function sourceBox(t){return `<div class="sourcebox"><p><strong>Base conceptual:</strong> Jesús Torres · Universidad de La Laguna.</p><p><a href="${BASE+t.path}" target="_blank" rel="noopener">Apuntes de Sistemas Operativos · ${t.id}. ${t.title}</a></p><p>Resumen adaptado. Escenario y visualizaciones didácticas propios. <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Licencia del material base: CC BY 4.0</a>.</p></div>`;}
function renderNav(){const nav=document.getElementById('topicNav');nav.innerHTML=CHAPTERS.map((c,g)=>{let items=TOPICS.filter(t=>t.group===g&&(!search||(t.title+' '+t.scene+' '+t.id).toLocaleLowerCase('es').includes(search)));return items.length?`<details class="navgroup" open><summary>${c.name} <span class="muted">${items.length}</span></summary>${items.map(t=>`<button class="navtopic ${t.id===currentId?'active':''} ${t.id===15?'recommend':''}" data-topic="${t.id}" ${t.id===currentId?'aria-current="page"':''}><span class="num">${t.id}</span><span>${t.title}</span></button>`).join('')}</details>`:'';}).join('')||'<p class="muted smalltext">No hay coincidencias.</p>';}
function renderCards(){let target=document.getElementById('homeCards');if(!target)return;let filtered=TOPICS.filter(t=>(homeGroup<0||t.group===homeGroup)&&(!search||(t.title+' '+t.scene+' '+t.id).toLocaleLowerCase('es').includes(search)));document.getElementById('resultCount').textContent=filtered.length+' temas';target.innerHTML=filtered.map(t=>`<article class="topiccard ${t.id===15?'recommended':''}"><div class="cardnumber">${CHAPTERS[t.group].name} · Tema ${t.id}</div><h3>${t.title}</h3><p>${t.summary}</p>${t.id===15?'<span class="tag">★ Recomendado para exponer</span>':''}<button class="${t.id===15?'primary':''}" data-topic="${t.id}">Abrir simulación</button></article>`).join('')||'<div class="panel"><p>No hay coincidencias. Prueba con otra palabra.</p></div>';}
function renderHome(){document.getElementById('main').innerHTML=`<section class="hero"><div><div class="eyebrow">Comprende · Experimenta · Explica</div><h1>El sistema se entiende<br>cuando lo pones a prueba.</h1><p>Veinte temas, veinte escenarios para observar qué sucede por dentro. Cambia una condición, avanza el ejemplo y explica el resultado.</p><div class="heroactions"><button class="primary" data-topic="15">Probar el tema recomendado</button><button data-group="-1">Explorar los 20 temas</button></div></div><div class="mini-board"><span class="tag">Tema 15 · Memoria principal</span><h3 style="margin-top:16px">¿Hay espacio… pero no cabe?</h3><div class="chipcells">${['A','Libre','C','Libre','E','Libre'].map((x,i)=>`<div class="cell ${x==='Libre'?'free':'p'+i}">${x}</div>`).join('')}</div><p class="smalltext">60 MiB libres, repartidos en huecos de 20 MiB.</p></div></section><div class="chapterbar" aria-label="Filtrar por bloque">${CHAPTERS.map((c,g)=>`<button class="chaptertile ${homeGroup===g?'active':''}" data-group="${g}" aria-pressed="${homeGroup===g}">${icon(c.icon)}${c.name}</button>`).join('')}</div><div class="listheading"><h2>${homeGroup<0?'Elige un tema para experimentar':CHAPTERS[homeGroup].name}</h2><div><span class="muted smalltext" id="resultCount"></span> ${homeGroup>=0?'<button class="small quiet" data-group="-1">Ver todos</button>':''}</div></div><div class="homegrid" id="homeCards"></div><p class="homefoot">Un solo archivo · Sin conexión · Datos simulados<br>Contenido conceptual adaptado de Jesús Torres, Universidad de La Laguna. Consulta Fuentes para acceder a los capítulos.</p>`;renderCards();}
function renderConcept(t){return `<div class="conceptgrid"><section class="panel"><h2>La idea que debes comprender</h2><p class="introtext">${t.lead}</p><ul class="keypoints">${t.points.map(p=>'<li>'+p+'</li>').join('')}</ul><div class="learncallout"><strong>Lo veremos con este ejemplo</strong><p>${t.scene}.</p><p>${t.instructions}</p><button class="primary" data-tab="sim">Experimentar</button></div></section><section class="panel"><h2>Vocabulario clave</h2>${t.terms.map(x=>`<div class="term"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}<p class="caption" style="margin-top:20px">Puedes volver a esta explicación sin perder el estado de la simulación.</p></section></div>${sourceBox(t)}`;}
function renderConclusion(t){return `<div class="closinggrid"><section class="panel"><div class="eyebrow">Lo que demuestra el ejemplo</div><h2>Conecta lo que viste con la teoría</h2><p class="introtext">${t.takeaway}</p><div class="bigquestion">${t.question}</div><details class="learncallout"><summary>Mostrar respuesta razonada</summary><p style="margin-top:12px">${t.answer}</p></details></section><section class="panel"><h2>${t.id===15?'Tu guion para exponer':'Cómo explicarlo en clase'}</h2>${t.id===15?`<ol class="speaking"><li>Pregunta: «Si hay 60 MiB libres, ¿por qué no cabe un proceso de 40 MiB?»</li><li>Reinicia y libera B, D y F. Señala los tres huecos de 20 MiB.</li><li>Solicita 40 MiB. Compara la memoria libre total con el mayor hueco.</li><li>Compacta y vuelve a solicitar. Explica que se reubicaron procesos, sin crear más memoria.</li><li>Concluye: «El espacio total no basta: en este modelo debe ser contiguo». Menciona el costo y el soporte de reubicación.</li></ol><button class="primary" data-demo="memory">Preparar esta demostración</button>`:`<ol class="speaking"><li>Presenta el concepto con tus propias palabras.</li><li>Haz que tus compañeros anticipen qué ocurrirá: «${t.question}»</li><li>Ejecuta el escenario y modifica una condición.</li><li>Explica el resultado: ${t.takeaway}</li></ol><button class="primary" data-tab="sim">Volver al ejemplo</button>`}</section></div>${sourceBox(t)}`;}
function renderLab(t){let s=topicState(t.id);return `<div class="labtop"><p><strong>Tu misión:</strong> ${t.instructions}</p><span class="tag">Simulación</span></div><div class="labgrid"><section class="panel simspace" aria-label="Controles y resultados"><div id="simBody">${SIMS[t.id].view(s)}</div><p class="modelnote"><strong>Alcance del modelo:</strong> ${t.note}</p></section><aside class="explain" aria-label="Explicación del resultado"><h3>¿Qué está pasando?</h3><p id="explanation">${esc(s.message)}</p><span class="stepnum">${s.step?'Acciones observadas: '+s.step:'Listo para experimentar'}</span><div class="learncallout"><strong>Observa esta idea</strong><p>${t.takeaway}</p></div></aside></div>`;}
function renderTopic(){const t=currentTopic();let main=document.getElementById('main');main.innerHTML=`<div class="topictitle"><div><div class="eyebrow">${CHAPTERS[t.group].name} · Tema ${t.id} de 20 ${t.id===15?'· Recomendado para exponer':''}</div><h1>${t.scene}</h1><p>${t.title} · ${t.summary}</p></div><div class="topictools"><button class="small" data-reset="true">Reiniciar ejemplo</button></div></div><div class="tabs" role="tablist" aria-label="Contenido del tema">${[['concept','Concepto'],['sim','Simulación'],['conclusion','Conclusión']].map(([id,label])=>`<button class="tab ${currentTab===id?'active':''}" role="tab" id="tab-${id}" data-tab="${id}" aria-selected="${currentTab===id}" aria-controls="tabpanel" tabindex="${currentTab===id?'0':'-1'}">${label}</button>`).join('')}</div><div id="tabpanel" role="tabpanel" aria-labelledby="tab-${currentTab}">${currentTab==='concept'?renderConcept(t):currentTab==='sim'?renderLab(t):renderConclusion(t)}</div><footer class="footer"><p>Fuente del tema: <a href="${BASE+t.path}" target="_blank" rel="noopener">Apuntes de Sistemas Operativos, ULL</a><br>Atajos: E · exposición; R · reiniciar; AvPág / RePág · siguiente / anterior.</p><div class="footerlinks"><button data-home="true">Inicio</button><button data-topic="${t.id-1}" ${t.id===1?'disabled':''}>Anterior</button><button class="primary" data-topic="${t.id+1}" ${t.id===20?'disabled':''}>Siguiente tema</button></div></footer>`;}
function renderSim(){if(!currentId||currentTab!=='sim')return;const t=currentTopic(),s=topicState(currentId),active=document.activeElement?.dataset.action;document.getElementById('tabpanel').innerHTML=renderLab(t);if(active){let target=[...document.querySelectorAll('[data-action]')].find(b=>b.dataset.action===active&&!b.disabled);target?.focus({preventScroll:true});}}
function announce(message){document.getElementById('announcer').textContent=message;}
function openTopic(id,tab='sim'){if(!SIMS[id])return;stopAuto();currentId=id;currentTab=tab;renderNav();renderTopic();history.replaceState(null,'','#tema-'+id);document.getElementById('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});announce('Tema '+id+': '+currentTopic().title);}
function showHome(){stopAuto();currentId=0;currentTab='concept';renderNav();renderHome();history.replaceState(null,'','#inicio');window.scrollTo({top:0,behavior:'instant'});}
function resetCurrent(){stopAuto();if(!currentId)return;let s=SIMS[currentId].init();s.message=currentTopic().instructions;states.set(currentId,s);renderTopic();announce('Ejemplo reiniciado.');}
function readForm(){let s=topicState(currentId);for(const el of document.querySelectorAll('#simBody [data-input]'))s.form[el.dataset.input]=el.type==='checkbox'?el.checked:el.type==='number'?el.valueAsNumber:el.value;}
function validForm(){for(const el of document.querySelectorAll('#simBody input'))if(!el.checkValidity()){el.reportValidity();return false;}return true;}
function dispatch(action){if(!currentId)return;if(!validForm())return;readForm();let s=topicState(currentId);if(action==='auto'&&currentId===14){if(automatic!==null){stopAuto();return;}automatic=setInterval(()=>{if(!bankStep(s)){stopAuto();return;}renderSim();if(s.pos>=(s.form.protected?7:6))stopAuto();},800);return;}SIMS[currentId].act(s,action);renderSim();announce(s.message);}
function togglePresent(){let on=document.body.classList.toggle('presenting');document.getElementById('presentButton').textContent=on?'Salir de exposición':'Modo exposición';document.getElementById('presentButton').setAttribute('aria-pressed',String(on));announce(on?'Modo exposición activado.':'Modo exposición desactivado.');}
function initialize(){renderNav();renderHome();const dialog=document.getElementById('sourcesDialog');document.getElementById('sourceContent').innerHTML=`<p><strong>Autoría de la presentación:</strong> Katherine Collaguazo · UNIB.E.</p><p><strong>Fuente conceptual:</strong> Jesús Torres. <em>Apuntes de Sistemas Operativos.</em> Grado en Ingeniería Informática, Universidad de La Laguna.</p><p>Las explicaciones están resumidas y adaptadas. Los escenarios, cifras y controles son modelos didácticos creados para esta presentación. No son herramientas para medir ni administrar el equipo.</p><p>Material base bajo <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Atribución 4.0 Internacional</a>, salvo indicación de la fuente. <a href="${BASE}" target="_blank" rel="noopener">Índice original</a>.</p><ol class="sourcelist">${TOPICS.map(t=>`<li><a href="${BASE+t.path}" target="_blank" rel="noopener">${t.title}</a></li>`).join('')}</ol><p class="smalltext muted">Para consultar los enlaces de la fuente se necesita conexión. El resto de la presentación funciona sin internet.</p>`;document.getElementById('homeButton').addEventListener('click',showHome);document.getElementById('presentButton').addEventListener('click',togglePresent);document.getElementById('sourcesButton').addEventListener('click',()=>dialog.showModal());document.getElementById('closeSources').addEventListener('click',()=>dialog.close());document.getElementById('topicSearch').addEventListener('input',e=>{search=e.target.value.toLocaleLowerCase('es').trim();renderNav();if(!currentId)renderCards();});document.addEventListener('click',e=>{let button=e.target.closest('button');if(!button||button.disabled)return;if(button.dataset.topic){openTopic(+button.dataset.topic);return;}if(button.dataset.home){showHome();return;}if(button.dataset.group!==undefined){homeGroup=+button.dataset.group;showHome();return;}if(button.dataset.tab){stopAuto();currentTab=button.dataset.tab;renderTopic();document.querySelector('#tab-'+currentTab)?.focus({preventScroll:true});return;}if(button.dataset.reset){resetCurrent();return;}if(button.dataset.demo){states.delete(15);openTopic(15);return;}if(button.dataset.action){dispatch(button.dataset.action);}});document.addEventListener('input',e=>{let el=e.target;if(!currentId||!el.dataset.input)return;let s=topicState(currentId);s.form[el.dataset.input]=el.type==='checkbox'?el.checked:el.type==='number'?el.valueAsNumber:el.value;});document.addEventListener('change',e=>{let el=e.target;if(!currentId||!el.dataset.config)return;if(!validForm())return;stopAuto();readForm();SIMS[currentId].act(topicState(currentId),'config',el.dataset.input);renderSim();});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||dialog.open)return;if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let tabs=['concept','sim','conclusion'];currentTab=tabs[(tabs.indexOf(currentTab)+(e.key==='ArrowRight'?1:2))%3];stopAuto();renderTopic();document.getElementById('tab-'+currentTab).focus();return;}if(e.key.toLowerCase()==='e'){e.preventDefault();togglePresent();}if(e.key.toLowerCase()==='r'&&currentId){e.preventDefault();resetCurrent();}if(e.key==='Escape'&&document.body.classList.contains('presenting'))togglePresent();if(e.key==='PageDown'&&currentId&&currentId<20){e.preventDefault();openTopic(currentId+1);}if(e.key==='PageUp'&&currentId>1){e.preventDefault();openTopic(currentId-1);}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAuto();});let match=location.hash.match(/^#tema-(\d+)$/);if(match&&SIMS[+match[1]])openTopic(+match[1]);}
globalThis.OSLab={TOPICS,SIMS,freeGaps,allocateContiguous,newSchedule,scheduleStep,bankInitial,bankStep,vmInitial,vmAccess,diskInitial,diskAllocate,raidAvailable};
if(typeof document!=='undefined')initialize();
</script>
</body></html>
